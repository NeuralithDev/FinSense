# =================================================================
# FinSense — Feature Catalog
# =================================================================
# Documents which features come from which dataset and their roles.
# Detailed implementation notes live in docs/FEATURE_CATALOG.md.

# ── Financial profile features (from cleaned_financial_data.csv) ─
financial_profile:
  identity:
    - user_id
    - age
    - gender
    - education_level
    - employment_status
    - job_title
    - region
    - record_date
  income_expense:
    - monthly_income_usd
    - monthly_expenses_usd
    - savings_usd
  debt:
    - loan_amount           # TODO: confirm exact column name after EDA
    - emi_amount            # monthly EMI
    - debt_to_income_ratio
  health:
    - credit_score
    - savings_to_income_ratio
  target_col: Category      # spending category label

# ── IBM transaction features (engineered from transactions) ──────
ibm_transaction:
  raw_cols:
    - user                  # TODO: confirm after EDA
    - card
    - year
    - month
    - day
    - time
    - amount
    - use_chip
    - merchant_name
    - merchant_city
    - merchant_state
    - merchant_zip
    - mcc                   # merchant category code
    - errors
  engineered:
    temporal:
      - hour_of_day
      - day_of_week
      - is_weekend
      - week_of_year
      - month_of_year
    spending:
      - tx_amount_log
      - rolling_7d_spend
      - rolling_30d_spend
      - spend_z_score         # deviation from user mean
      - category_spend_share
    behavioral:
      - tx_frequency_7d
      - tx_frequency_30d
      - unique_merchants_30d
      - preferred_category
      - night_tx_ratio

# ── PaySim features (behavioral / cash-flow only) ────────────────
paysim:
  raw_cols:
    - step                  # time step (hours)
    - type                  # CASH_IN | CASH_OUT | DEBIT | PAYMENT | TRANSFER
    - amount
    - nameOrig
    - oldbalanceOrg
    - newbalanceOrig
    - nameDest
    - oldbalanceDest
    - newbalanceDest
  # NOTE: isFraud and isFlaggedFraud are NOT used as primary targets
  exclude_cols:
    - isFraud
    - isFlaggedFraud
  engineered:
    cashflow:
      - net_balance_change
      - balance_before_ratio
      - cashout_frequency
      - transfer_to_cashout_ratio

# ── Derived / composite features ─────────────────────────────────
composite:
  financial_health_score:   # computed in src/financial_health/health_score.py
    inputs: [savings_ratio, debt_to_income_ratio, expense_to_income, credit_score]
    output: financial_health_score   # scalar 0–100
  user_financial_state:     # computed in src/fusion/user_financial_state.py
    inputs: [financial_health_score, spending_features, behavioral_features]
    output: user_state_vector
