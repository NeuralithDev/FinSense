# =================================================================
# FinSense — Master Configuration
# =================================================================
# Paths are relative to the project root.
# Raw data is READ-ONLY — never write back to data/raw/.

project:
  name: FinSense
  version: "1.0.0"
  description: "AI-Powered Personal Finance Intelligence System"
  random_seed: 42
  device: auto            # 'cpu' | 'cuda' | 'mps' | 'auto'
  log_level: INFO

# ── Data paths ───────────────────────────────────────────────────
data:
  raw:
    financial: data/raw/financial/cleaned_financial_data.csv
    ibm_transactions: data/raw/IBM/credit_card_transactions-ibm_v2.csv
    ibm_users: data/raw/IBM/sd254_users.csv
    ibm_cards: data/raw/IBM/sd254_cards.csv
    ibm_user0: data/raw/IBM/User0_credit_card_transactions.csv
    paysim: data/raw/paysim/PaySim.csv
  interim: data/interim/
  processed: data/processed/
  chunk_size: 100_000     # rows per chunk for large CSV processing

# ── Temporal split (time-based, no shuffle) ──────────────────────
split:
  test_months: 3
  val_months: 2

# ── Output directories ───────────────────────────────────────────
output:
  models: models/
  artifacts: artifacts/
  experiments: experiments/

# ── Forecasting ──────────────────────────────────────────────────
forecasting:
  horizon_months: 3       # months ahead to predict
  sequence_length: 6      # months of history as input window
  model: prophet           # 'prophet' | 'lstm' | 'arima'

# ── Financial health scoring ─────────────────────────────────────
financial_health:
  weights:
    savings_ratio: 0.25
    debt_to_income: 0.25
    expense_to_income: 0.25
    credit_score: 0.25
  thresholds:
    savings_ratio_good: 0.20
    debt_to_income_safe: 0.36
    expense_to_income_healthy: 0.70

# ── Scenario analysis ────────────────────────────────────────────
scenarios:
  default_months_to_project: 12
  min_emergency_fund_months: 3

# ── Recommendations ──────────────────────────────────────────────
recommendations:
  max_recommendations: 5
  min_priority_score: 0.3

# ── AI Assistant ─────────────────────────────────────────────────
ai:
  provider: openai          # 'openai' | 'anthropic' | 'local'
  model: gpt-4o-mini
  max_context_tokens: 4096
  temperature: 0.3

# ── API ──────────────────────────────────────────────────────────
api:
  host: 0.0.0.0
  port: 8000
  debug: false
  reload: true
